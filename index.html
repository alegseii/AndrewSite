<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch A1: Hub & Trainer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding-bottom: 60px; }

        /* Навигация */
        nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .nav-btn { background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; }
        .nav-btn:hover, .nav-btn.active { border-color: var(--accent); background-color: #334155; color: var(--accent); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        header { text-align: center; padding: 10px 0 20px; margin-bottom: 20px; }
        h1 { color: var(--accent); font-size: 2rem; margin-bottom: 8px; }

        /* Раздел КАРТОЧЕК */
        .flashcard-container { perspective: 1000px; width: 100%; max-width: 480px; height: 270px; margin: 20px auto; cursor: pointer; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s ease; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; border: 2px solid var(--accent); background-color: var(--card-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .card-back { transform: rotateY(180deg); border-color: var(--success); }
        .card-word { font-size: 1.8rem; font-weight: bold; color: var(--text-main); margin-bottom: 10px; }
        .card-sub { font-size: 1.1rem; color: var(--text-muted); }
        .card-hint { position: absolute; bottom: 12px; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .controls { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .action-btn { background-color: var(--accent); color: #0f172a; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Раздел ШПАРАГАЛОК */
        .cheat-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; line-height: 1.6; }
        .cheat-card h2 { color: var(--accent); margin-bottom: 12px; font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .cheat-card ul { margin-left: 20px; margin-top: 8px; }
        .cheat-card li { margin-bottom: 6px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 10px; }
        th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        th { background-color: #0f172a; color: var(--accent); }

        /* Стили тренажера Perfekt */
        .score-board { position: sticky; top: 15px; z-index: 100; background-color: var(--card-bg); border: 2px solid var(--accent); border-radius: 10px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .exercise-item { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
        .option-btn { background-color: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 12px 15px; border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.2s ease; }
        .option-btn:hover:not([disabled]) { border-color: var(--accent); }
        .feedback { margin-top: 14px; padding: 14px; border-radius: 6px; display: none; }
        .feedback.correct { display: block; background-color: rgba(34, 197, 94, 0.15); border: 1px solid var(--success); color: #4ade80; }
        .feedback.incorrect { display: block; background-color: rgba(239, 68, 68, 0.15); border: 1px solid var(--error); color: #f87171; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Deutsch A1: Hub & Trainer</h1>
        <p style="color: var(--text-muted)">Карточки слов, шпаргалки и интерактивные тренажёры</p>
    </header>

    <!-- Навигация по разделам -->
    <nav>
        <button class="nav-btn active" onclick="switchTab('cards')">🎴 Карточки слов</button>
        <button class="nav-btn" onclick="switchTab('cheatsheet')">📖 Шпаргалки A1</button>
        <button class="nav-btn" onclick="switchTab('perfekt-quiz')">⚡ Тренажёр Perfekt</button>
    </nav>

    <!-- Вкладка 1: Карточки слов -->
    <div id="tab-cards" class="tab-content active">
        <div style="text-align: center; margin-bottom: 10px;">
            <span id="card-category" style="color: var(--accent); font-weight: bold;">Тема</span> | 
            <span id="card-counter" style="color: var(--text-muted);">1 из 10</span>
        </div>

        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="card-word" id="card-de">Wort</div>
                    <div class="card-hint">Кликни, чтобы перевернуть</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-word" id="card-ru">Перевод</div>
                    <div class="card-sub" id="card-pl">Форма мн.ч.</div>
                    <div class="card-hint">Русский перевод</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn" onclick="prevCard()">← Назад</button>
            <button class="action-btn" onclick="nextCard()">Вперёд →</button>
            <button class="action-btn" style="background-color: #e2e8f0;" onclick="reshuffle()">🔀 Перемешать</button>
        </div>
    </div>

    <!-- Вкладка 2: Шпаргалки -->
    <div id="tab-cheatsheet" class="tab-content">
        <div id="cheatsheet-container"></div>
    </div>

    <!-- Вкладка 3: Тренажер Perfekt -->
    <div id="tab-perfekt-quiz" class="tab-content">
        <div class="score-board">
            <div>Твой результат: <span id="score" style="color: var(--accent); font-size: 1.3rem; font-weight: bold;">0</span> / 5</div>
            <div id="progress-percent" style="color: var(--text-muted); font-weight: 600;">0%</div>
        </div>
        <div id="quiz-container"></div>
    </div>
</div>

<script src="words.js"></script>
<script src="cheatsheet.js"></script>
<script>
// --- Подгрузка шпаргалок из cheatsheet.js ---
document.getElementById('cheatsheet-container').innerHTML = cheatSheetHTML;

// --- Переключение вкладок ---
function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(`tab-${tabId}`).classList.add('active');
    event.target.classList.add('active');
}

// --- Логика Карточек ---
let activeWords = [];
let currentCardIndex = 0;

function initCards() {
    if (typeof wordsData !== 'undefined' && wordsData.length > 0) {
        activeWords = shuffleWords(wordsData);
        currentCardIndex = 0;
        updateCard();
    }
}

function updateCard() {
    if (activeWords.length === 0) return;
    const card = activeWords[currentCardIndex];
    document.getElementById('flashcard').classList.remove('flipped');
    
    setTimeout(() => {
        document.getElementById('card-de').innerText = card.de;
        document.getElementById('card-ru').innerText = card.ru;
        document.getElementById('card-pl').innerText = `Мн.ч. / формы: ${card.pl}`;
        document.getElementById('card-category').innerText = card.category;
        document.getElementById('card-counter').innerText = `${currentCardIndex + 1} из ${activeWords.length}`;
    }, 150);
}

function flipCard() {
    document.getElementById('flashcard').classList.toggle('flipped');
}

function nextCard() {
    currentCardIndex = (currentCardIndex + 1) % activeWords.length;
    updateCard();
}

function prevCard() {
    currentCardIndex = (currentCardIndex - 1 + activeWords.length) % activeWords.length;
    updateCard();
}

function reshuffle() {
    activeWords = shuffleWords(activeWords);
    currentCardIndex = 0;
    updateCard();
}

// Инициализация при старте
initCards();

// --- Логика Тренажера Perfekt ---
const quizData = [
    { q: "Выбери вспомогательный глагол: 'Ich _____ gestern nach Berlin gefahren.'", opts: [{ txt: "habe", correct: false, exp: "Fahren — это глагол перемещения, с ним нужен sein!" }, { txt: "bin", correct: true, exp: "Fahren обозначает движение, поэтому Perfekt с sein." }, { txt: "war", correct: false, exp: "War — форма Präteritum." }] },
    { q: "Выбери вспомогательный глагол: 'Wir _____ gestern eine neue Küche gekauft.'", opts: [{ txt: "sind", correct: false, exp: "Kaufen — обычное действие без движения." }, { txt: "haben", correct: true, exp: "Kaufen — переходный глагол, образует Perfekt с haben." }, { txt: "werden", correct: false, exp: "Werden — не подходит." }] },
    { q: "Глагол смены состояния: 'Das Kind _____ sehr schnell eingeschlafen.'", opts: [{ txt: "ist", correct: true, exp: "Einschlafen (засыпать) — смена состояния, с ним нужен sein!" }, { txt: "hat", correct: false, exp: "Нужен sein." }, { txt: "wird", correct: false, exp: "Не подходит." }] },
    { q: "Partizip II от регулярного глагола 'machen': 'Was hast du gestern _____?'", opts: [{ txt: "gemacht", correct: true, exp: "Регулярный слабый глагол: ge + mach + t = gemacht." }, { txt: "gemachen", correct: false, exp: "Неверно." }, { txt: "gemachted", correct: false, exp: "Неверно." }] },
    { q: "Partizip II от сильного глагола 'gehen': 'Sie ist zum Supermarkt _____.'", opts: [{ txt: "gegeht", correct: false, exp: "Сильный глагол с изменением корня!" }, { txt: "gegangen", correct: true, exp: "Правильно: gegangen." }, { txt: "gegingen", correct: false, exp: "Форма Präteritum." }] }
];

let totalScore = 0;
let answeredCount = 0;

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';
    quizData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'exercise-item';
        let optsHtml = '';
        item.opts.forEach((opt, oIndex) => {
            optsHtml += `<button class="option-btn" onclick="checkEx(${index}, ${oIndex})">${opt.txt}</button>`;
        });
        card.innerHTML = `<div style="color: var(--accent); font-size: 0.9rem; margin-bottom: 5px;">Задание ${index + 1}</div><div style="font-size: 1.1rem; margin-bottom: 10px;">${item.q}</div><div class="options-grid">${optsHtml}</div><div class="feedback" id="fb-${index}"></div>`;
        container.appendChild(card);
    });
}

function checkEx(exIndex, optIndex) {
    const selectedOpt = quizData[exIndex].opts[optIndex];
    const fb = document.getElementById(`fb-${exIndex}`);
    if (selectedOpt.correct) {
        fb.className = 'feedback correct';
        fb.innerHTML = '✅ <b>Верно!</b> ' + selectedOpt.exp;
        totalScore++;
    } else {
        fb.className = 'feedback incorrect';
        fb.innerHTML = '❌ <b>Ошибка:</b> ' + selectedOpt.exp;
    }
    answeredCount++;
    document.getElementById('score').innerText = totalScore;
    document.getElementById('progress-percent').innerText = `${Math.round((answeredCount / quizData.length) * 100)}%`;
}

renderQuiz();
</script>
</body>
</html>
