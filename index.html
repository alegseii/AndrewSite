<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch A1: Hub & Trainer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding-bottom: 60px; }

        /* Навигация */
        nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .nav-btn { background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; }
        .nav-btn:hover, .nav-btn.active { border-color: var(--accent); background-color: #334155; color: var(--accent); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        header { text-align: center; padding: 10px 0 20px; margin-bottom: 20px; }
        h1 { color: var(--accent); font-size: 2rem; margin-bottom: 8px; }

        /* Выбор категории */
        .category-select-wrapper { text-align: center; margin-bottom: 15px; }
        .category-select { background-color: var(--card-bg); border: 1px solid var(--accent); color: var(--text-main); padding: 10px 16px; border-radius: 8px; font-size: 1rem; cursor: pointer; outline: none; font-weight: bold; }
        .category-select:focus { border-color: var(--success); }

        /* Раздел КАРТОЧЕК */
        .flashcard-container { perspective: 1000px; width: 100%; max-width: 480px; height: 270px; margin: 20px auto; cursor: pointer; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s ease; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; border: 2px solid var(--accent); background-color: var(--card-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .card-back { transform: rotateY(180deg); border-color: var(--success); }
        .card-word { font-size: 1.8rem; font-weight: bold; color: var(--text-main); margin-bottom: 10px; }
        .card-sub { font-size: 1.1rem; color: var(--text-muted); }
        .card-hint { position: absolute; bottom: 12px; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .controls { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .action-btn { background-color: var(--accent); color: #0f172a; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Раздел ШПАРАГАЛОК */
        .cheat-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; line-height: 1.6; }
        .cheat-card h2 { color: var(--accent); margin-bottom: 12px; font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .cheat-card ul { margin-left: 20px; margin-top: 8px; }
        .cheat-card li { margin-bottom: 6px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 10px; }
        th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        th { background-color: #0f172a; color: var(--accent); }

        /* Стили тренажеров */
        .score-board { position: sticky; top: 15px; z-index: 100; background-color: var(--card-bg); border: 2px solid var(--accent); border-radius: 10px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .exercise-item { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
        .option-btn { background-color: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 12px 15px; border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.2s ease; }
        .option-btn:hover:not([disabled]) { border-color: var(--accent); }
        .feedback { margin-top: 14px; padding: 14px; border-radius: 6px; display: none; }
        .feedback.correct { display: block; background-color: rgba(34, 197, 94, 0.15); border: 1px solid var(--success); color: #4ade80; }
        .feedback.incorrect { display: block; background-color: rgba(239, 68, 68, 0.15); border: 1px solid var(--error); color: #f87171; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Deutsch A1: Hub & Trainer</h1>
        <p style="color: var(--text-muted)">Карточки слов, база правил и интерактивные тренажёры</p>
    </header>

    <!-- Навигация по разделам -->
    <nav>
        <button class="nav-btn active" onclick="switchTab('cards')">🎴 Карточки слов</button>
        <button class="nav-btn" onclick="switchTab('cheatsheet')">📖 База правил</button>
        <button class="nav-btn" onclick="switchTab('quiz-perfekt')">⚡ Тренажёр Perfekt</button>
    </nav>

    <!-- Вкладка 1: Карточки слов -->
    <div id="tab-cards" class="tab-content active">
        <div class="category-select-wrapper">
            <label for="categoryFilter" style="color: var(--text-muted); margin-right: 8px;">Раздел:</label>
            <select id="categoryFilter" class="category-select" onchange="filterByCategory(this.value)"></select>
        </div>

        <div style="text-align: center; margin-bottom: 10px;">
            <span id="card-counter" style="color: var(--text-muted);">1 из 10</span>
        </div>

        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="card-word" id="card-de">Wort</div>
                    <div class="card-hint">Кликни, чтобы перевернуть</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-word" id="card-ru">Перевод</div>
                    <div class="card-sub" id="card-pl">Форма мн.ч.</div>
                    <div class="card-hint">Русский перевод</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn" onclick="prevCard()">← Назад</button>
            <button class="action-btn" onclick="nextCard()">Вперёд →</button>
            <button class="action-btn" style="background-color: #e2e8f0; color: #0f172a;" onclick="reshuffle()">🔀 Перемешать</button>
        </div>
    </div>

    <!-- Вкладка 2: База правил -->
    <div id="tab-cheatsheet" class="tab-content">
        <div id="cheatsheet-container"></div>
    </div>

    <!-- Вкладка 3: Тренажер Perfekt -->
    <div id="tab-quiz-perfekt" class="tab-content">
        <div class="score-board">
            <div>Правильных ответов: <span id="score-perfekt" style="color: var(--accent); font-size: 1.3rem; font-weight: bold;">0</span> / 20</div>
            <div id="progress-perfekt" style="color: var(--text-muted); font-weight: 600;">Сессия из 20 вопросов</div>
        </div>
        <div id="container-perfekt"></div>
    </div>
</div>

<!-- Подключаем оригинальные файлы данных -->
<script src="words.js"></script>
<script src="cheatsheet.js"></script>
<script src="perfekt-data.js"></script>

<script>
// --- Подгрузка базы правил ---
if (typeof cheatSheetHTML !== 'undefined') {
    document.getElementById('cheatsheet-container').innerHTML = cheatSheetHTML;
}

// --- Переключение вкладок ---
function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(`tab-${tabId}`).classList.add('active');
    event.target.classList.add('active');
}

// --- Безопасное получение массива слов из words.js ---
function getWordsSource() {
    if (typeof wordsData !== 'undefined') return wordsData;
    if (typeof words !== 'undefined' && Array.isArray(words)) return words;
    return [];
}

// --- Логика Карточек слов ---
let activeWords = [];
let currentCardIndex = 0;

function initCategorySelect() {
    const select = document.getElementById('categoryFilter');
    const sourceWords = getWordsSource();
    if (sourceWords.length === 0) return;

    const categories = ['Все разделы', ...new Set(sourceWords.map(w => w.category))];
    select.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
    filterByCategory('Все разделы');
}

function filterByCategory(category) {
    const sourceWords = getWordsSource();
    if (category === 'Все разделы') {
        activeWords = shuffleWords(sourceWords);
    } else {
        activeWords = shuffleWords(sourceWords.filter(w => w.category === category));
    }
    currentCardIndex = 0;
    updateCard();
}

function updateCard() {
    if (!activeWords || activeWords.length === 0) return;
    const card = activeWords[currentCardIndex];
    document.getElementById('flashcard').classList.remove('flipped');
    setTimeout(() => {
        document.getElementById('card-de').innerText = card.de;
        document.getElementById('card-ru').innerText = card.ru;
        document.getElementById('card-pl').innerText = `Мн.ч. / формы: ${card.pl}`;
        document.getElementById('card-counter').innerText = `${currentCardIndex + 1} из ${activeWords.length}`;
    }, 150);
}

function flipCard() { document.getElementById('flashcard').classList.toggle('flipped'); }
function nextCard() { currentCardIndex = (currentCardIndex + 1) % activeWords.length; updateCard(); }
function prevCard() { currentCardIndex = (currentCardIndex - 1 + activeWords.length) % activeWords.length; updateCard(); }
function reshuffle() { activeWords = shuffleWords(activeWords); currentCardIndex = 0; updateCard(); }

function shuffleWords(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

// --- УНИВЕРСАЛЬНЫЙ ДВИЖОК ТРЕНАЖЕРА ---
let activeQuizSessions = {};
let quizResetHandlers = {}; // Безопасный словарь обработчиков перезапуска

function initQuizEngine(fullDataArray, containerId, scoreId, progressId) {
    let currentSession = [];
    let score = 0;

    function loadNewSession() {
        const shuffled = [...fullDataArray].sort(() => Math.random() - 0.5);
        currentSession = shuffled.slice(0, Math.min(20, shuffled.length));
        score = 0;

        activeQuizSessions[containerId] = currentSession;

        document.getElementById(scoreId).innerText = score;
        document.getElementById(progressId).innerText = `Вопросов в сессии: ${currentSession.length}`;
        
        renderHTML();
        window.scrollTo({ top: 0, behavior: 'smooth' }); // Возврат наверх при обновлении
    }

    function renderHTML() {
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        currentSession.forEach((item, qIndex) => {
            const card = document.createElement('div');
            card.className = 'exercise-item';

            const indexedOpts = item.opts.map((opt, originalIdx) => ({ ...opt, originalIdx }));
            const shuffledOpts = indexedOpts.sort(() => Math.random() - 0.5);

            let optsHtml = '';
            shuffledOpts.forEach((opt) => {
                optsHtml += `<button class="option-btn" onclick="handleAnswerClick(this, ${qIndex}, ${opt.originalIdx}, '${containerId}', '${scoreId}')">${opt.txt}</button>`;
            });

            card.innerHTML = `
                <div style="color: var(--accent); font-size: 0.9rem; margin-bottom: 5px;">Задание ${qIndex + 1} из ${currentSession.length}</div>
                <div style="font-size: 1.1rem; margin-bottom: 10px;">${item.q}</div>
                <div class="options-grid">${optsHtml}</div>
                <div class="feedback" id="${containerId}-fb-${qIndex}"></div>
            `;
            container.appendChild(card);
        });

        const btnWrapper = document.createElement('div');
        btnWrapper.style.textAlign = 'center';
        btnWrapper.style.marginTop = '25px';
        btnWrapper.style.marginBottom = '40px';

        // Создаем рабочую кнопку перезапуска сессии
        const resetBtn = document.createElement('button');
        resetBtn.className = 'action-btn';
        resetBtn.style.backgroundColor = 'var(--success)';
        resetBtn.style.color = '#fff';
        resetBtn.style.padding = '14px 30px';
        resetBtn.style.fontSize = '1.05rem';
        resetBtn.innerHTML = '🔄 Пройти ещё раз (новые 20 вопросов)';
        resetBtn.onclick = () => {
            if (quizResetHandlers[containerId]) {
                quizResetHandlers[containerId]();
            }
        };

        btnWrapper.appendChild(resetBtn);
        container.appendChild(btnWrapper);
    }

    // Регистрируем функцию перезапуска в словаре
    quizResetHandlers[containerId] = loadNewSession;
    loadNewSession();
}

function handleAnswerClick(btnElement, qIndex, originalOptIdx, containerId, scoreId) {
    const parentGrid = btnElement.parentElement;
    const buttons = parentGrid.querySelectorAll('.option-btn');
    
    buttons.forEach(b => b.disabled = true);

    const sessionData = activeQuizSessions[containerId];
    const questionObj = sessionData[qIndex];
    const selectedOpt = questionObj.opts[originalOptIdx];

    const feedbackDiv = document.getElementById(`${containerId}-fb-${qIndex}`);

    if (selectedOpt.correct) {
        btnElement.style.backgroundColor = 'rgba(34, 197, 94, 0.25)';
        btnElement.style.borderColor = 'var(--success)';
        feedbackDiv.className = 'feedback correct';
        feedbackDiv.innerHTML = '✅ <b>Верно!</b> ' + selectedOpt.exp;
        
        let scoreElem = document.getElementById(scoreId);
        scoreElem.innerText = parseInt(scoreElem.innerText) + 1;
    } else {
        btnElement.style.backgroundColor = 'rgba(239, 68, 68, 0.25)';
        btnElement.style.borderColor = 'var(--error)';
        feedbackDiv.className = 'feedback incorrect';
        feedbackDiv.innerHTML = '❌ <b>Ошибка:</b> ' + selectedOpt.exp;
    }
    feedbackDiv.style.display = 'block';
}

// Запуск при полной загрузке страницы
window.addEventListener('DOMContentLoaded', () => {
    initCategorySelect(); // Инициализация карточек
    
    if (typeof perfektQuestions !== 'undefined') {
        initQuizEngine(perfektQuestions, 'container-perfekt', 'score-perfekt', 'progress-perfekt');
    }
});
</script>
</body>
</html>
